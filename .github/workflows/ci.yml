name: CI

# Build verification + tests in two lanes: `go-build-and-test` (lint, build,
# cross-compile, unit tests over src/go/) and `tudiff` (the differential
# harness: bin/tu against the committed golden corpus, matrix plus live). This
# workflow runs in two contexts:
#   - on pull requests targeting main, to GATE merges (the aggregating
#     `ci-gate` job below is the stable required status check enforced by a
#     branch ruleset on main — see scripts/ci-gate-ruleset.sh and README), and
#   - on pushes to main, to verify the merge commit after it lands.
# This is intentionally separate from release.yml: it does NOT publish anything
# (GitHub Release, Homebrew tap) — those external side effects live in
# release.yml (whose release job runs on a v* tag push or workflow_dispatch);
# this workflow only verifies the build and runs the test suites.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-build-and-test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so `git describe` (the justfile's go_version) sees tags.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Single source of truth for the Go version. Pinning to go.mod also
          # pins gofmt's rules, so the lint check matches the toolchain that
          # wrote the files.
          go-version-file: src/go/go.mod
          # No go.sum yet (zero dependencies) — setup-go's cache needs one.
          # Flip to `cache-dependency-path: src/go/go.sum` when the first
          # dependency lands.
          cache: false

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Lint (gofmt + go vet)
        run: just go-lint

      - name: Build
        run: just go-build

      # Cross-compile all four release targets (no network) — catches
      # GOOS-specific compile breaks on every PR. Packaging (registry fetch)
      # runs at release time and via `just go-dist`, not in the PR gate.
      - name: Cross-compile
        run: just go-build-all

      - name: Test
        run: just go-test

  # Differential harness (plan row Z1): byte-diff bin/tu against the committed
  # golden corpus (harness/golden/) over harness/matrix.json against the
  # placeholder corpus, then the real-git live sequence against
  # harness/golden/live/. This job GATES: tudiff exits 1 on an unexpected red
  # case, a timeout, a replay of an unconfirmed fixture, or a stale expected
  # entry (expected diffs come from harness/expected-diffs.json). The report is
  # uploaded as an artifact on every run, and ci-gate needs this job.
  tudiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/go/go.mod
          cache: false

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Differential harness (placeholder matrix)
        run: just go-diff --placeholder

      - name: Live harness (real git)
        run: just go-live

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tudiff-report
          path: |
            bin/harness/report/
            bin/harness/report-live/

  # Single, stable status-check name for the branch ruleset on main to require.
  # `if: always()` so the gate reports a definitive pass/fail even when
  # a required job fails or is cancelled (a skipped required check would
  # otherwise block/hang the PR).
  ci-gate:
    needs: [go-build-and-test, tudiff]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        run: |
          if [ "${{ needs.go-build-and-test.result }}" != "success" ]; then
            echo "go-build-and-test did not succeed (result: ${{ needs.go-build-and-test.result }})"
            exit 1
          fi
          if [ "${{ needs.tudiff.result }}" != "success" ]; then
            echo "tudiff did not succeed (result: ${{ needs.tudiff.result }})"
            exit 1
          fi
          echo "All required CI jobs passed."
