name: Release

# Releases are tag-driven: `just release` (scripts/release.sh) computes the
# next tag from `git tag -l 'v*' --sort=-v:refname`, tags, and pushes — no
# version file, no release commit. The tag is the single version anchor the
# Homebrew tap and history depend on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Release pipeline (tag-push + manual dispatch) ─────────────────────
  # Runs in two cases, each exactly once:
  #   1. a real v* tag push  → startsWith(github.ref, 'refs/tags/v')
  #   2. workflow_dispatch   → manual bump-and-tag in-place (from main only)
  # The release builds and uploads the tu-go-* Go assets (four tarballs +
  # SHA256SUMS, plan row R1 / D8) and pushes the generated Go formula
  # (dist/tu.rb — prebuilt tarballs, no runtime dependencies) to the Homebrew
  # tap.
  release:
    # workflow_dispatch must run from main; tag-push is allowed from any ref.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Check out the right ref for each path:
      #   - tag push   → the tag (github.ref) — the canonical version anchor
      #   - dispatch   → main (release.sh tags from here)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      # Go toolchain for the tu-go-* asset steps below (same pinned SHA and
      # settings as ci.yml's Go lane).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/go/go.mod
          cache: false

      # On manual dispatch, run scripts/release.sh — it computes the next tag,
      # tags, and pushes the tag (no file edits, no commit).
      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: create_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/release.sh "${{ inputs.bump }}"
          echo "tag=$(git tag --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ steps.create_tag.outputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      # ── Fail-loud steps FIRST (before any external side effect) ──────────
      # Go asset steps (plan row R1): cross-compile, package the tu-go-*
      # tarballs, and generate the Go formula into dist/tu.rb (pushed to the
      # tap in the last step). All before "Create GitHub Release" — a failure
      # aborts before any external side effect.
      - name: Cross-compile Go binaries
        run: just go-build-all

      - name: Package tu-go assets
        run: just go-package

      - name: Generate Go formula (dist/tu.rb — pushed to the tap below)
        run: |
          just go-formula "${{ steps.version.outputs.tag }}"
          cat dist/tu.rb

      - name: Generate release notes
        run: just release-notes "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "tu ${{ steps.version.outputs.tag }}" \
            --notes-file dist/release-notes.md \
            dist/tu-go-darwin-arm64.tar.gz \
            dist/tu-go-darwin-amd64.tar.gz \
            dist/tu-go-linux-arm64.tar.gz \
            dist/tu-go-linux-amd64.tar.gz \
            dist/tu-go-SHA256SUMS

      # Ship the Go formula generated above (plan row X1): dist/tu.rb replaces
      # the tap's Formula/tu.rb wholesale. Last on purpose — the tarball URLs it
      # carries resolve only once the GitHub Release above exists.
      # Rollback note: `tu update` runs `brew upgrade tu`, which never downgrades,
      # so reverting the tap alone does not move an already-upgraded machine back.
      # To roll users back, cut a higher-numbered release whose formula points at
      # a pre-Z1 tag (the pre-Z1 tags carry the retired TypeScript tree in their
      # own history, so the old formula there still builds). See
      # docs/memory/build/go-release-pipeline.md.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/sahil87/homebrew-tap.git" /tmp/tap
          cp dist/tu.rb /tmp/tap/Formula/tu.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tu.rb
          git commit -m "tu ${version}"
          git push
